<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LuxeBeauty</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .auth-bg {
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('https://images.unsplash.com/photo-1560066984-138dadb4c035?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') center/cover;
            height: 100vh;
        }

        .auth-card {
            max-width: 400px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }
    </style>
    <link rel="icon" href="assets/images/favicon.png" type="image/png">
</head>

<body class="auth-bg d-flex align-items-center justify-content-center">

    <div class="auth-card shadow-lg">
        <div class="text-center mb-4">
            <a href="index.html" class="d-flex align-items-center justify-content-center text-decoration-none">
                <img src="assets/images/logo.png" alt="LuxeBeauty" height="40" class="me-2">
                <h3 class="mb-0 text-primary-custom">LuxeBeauty</h3>
            </a>
            <p class="text-muted">Welcome back</p>
        </div>

        <form action="dashboard.html">
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control" placeholder="name@example.com">
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" placeholder="••••••••">
            </div>
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label small" for="rememberMe">Remember me</label>
                </div>
                <a href="#" class="small text-muted">Forgot password?</a>
            </div>
            <button type="submit" class="btn btn-primary-custom w-50 mb-3 mx-auto d-block">Log In</button>
            <div class="text-center">
                <p class="small text-muted">Don't have an account? <a href="register.html"
                        class="text-primary-custom">Sign Up</a></p>
                <div class="mt-3">
                    <a href="index.html" class="small text-muted">Back to Home</a>
                </div>
            </div>
        </form>

        <!-- Demo Note -->
        <div class="alert alert-info small mt-4 mb-0 text-center">
            Demo Tip: Click "Log In" to access Dashboard.
        </div>
    </div>

</body>

</html>
